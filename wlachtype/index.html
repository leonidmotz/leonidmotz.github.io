<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wlachtype</title>
<style>
/* Layout: one-screen tool. Writing surface fills the top half; a docked key deck holds three labelled rows below. */
:root {
  --paper: #eef0f4;
  --ink: #1a2130;
  --muted: #677086;
  --deck: #dfe3ea;
  --key: #fbfcfd;
  --key-edge: #b9c0cd;
  --accent: #9a6b12;
  --accent-soft: #f3e6c9;
  --danger: #b3261e;
  --select: #6a4aa8;
  --dots-bg: #5d6680;
  --vapor: linear-gradient(115deg, #5b3a9c 0%, #a2387e 45%, #2f6fa3 100%);
  --font-text: "Noto Sans", sans-serif;
  --font-ui: "Noto Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121620; --ink: #e7e9ef; --muted: #8b93a7; --deck: #1a1f2b;
    --key: #252b39; --key-edge: #0b0e14; --accent: #dcae52; --accent-soft: #3a3020; --danger: #f2867c; --select: #7b5cc4; --dots-bg: #3d4559;
    --vapor: linear-gradient(115deg, #f6c4ec 0%, #cdbcff 45%, #aeeef2 100%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121620; --ink: #e7e9ef; --muted: #8b93a7; --deck: #1a1f2b;
  --key: #252b39; --key-edge: #0b0e14; --accent: #dcae52; --accent-soft: #3a3020; --danger: #f2867c; --select: #7b5cc4; --dots-bg: #3d4559;
  --vapor: linear-gradient(115deg, #f6c4ec 0%, #cdbcff 45%, #aeeef2 100%);
  color-scheme: dark;
}

[hidden] { display: none !important; }
/* only the text field is selectable; labels, keys and the status line cannot be copied */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#text { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-text);
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* ---------- writing surface ---------- */
.page { flex: 0 0 50%; display: flex; flex-direction: column; padding-inline: max(16px, 4vw); padding-block: 20px 0; min-height: 0; }
#text {
  flex: 1; min-height: 0; width: 100%; box-sizing: border-box; padding: 0 40px 0 0;
  border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
  font-family: var(--font-text); font-size: 64px; font-weight: 700; line-height: 1.4;
  caret-color: var(--accent);
  background: var(--vapor); -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
}
#text::selection { color: #fff; -webkit-text-fill-color: #fff; background: var(--select); }
.meta {
  display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  font-family: var(--font-ui); font-size: 12px; color: var(--muted);
  padding-block: 10px; border-top: 1px solid color-mix(in srgb, var(--muted) 25%, transparent);
}
.meta .hint b { color: var(--ink); font-weight: 500; }
.meta button {
  font: inherit; color: var(--muted); background: none; border: 0; padding: 4px 6px; border-radius: 4px; cursor: pointer;
}
.meta button:hover { color: var(--ink); }
.meta button:focus-visible, .k:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- key deck ---------- */
.deck {
  flex: 1; min-height: 0; overflow-y: auto;
  background: var(--deck);
  border-radius: 18px 18px 0 0;
  padding-inline: max(16px, 3vw);
  padding-block: 14px calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
  /* centred via auto margins (below), so on short screens the top rows stay reachable when it scrolls */
}
.deck > :first-child { margin-top: auto; }
.deck > :last-child { margin-bottom: auto; }
.status {
  font-family: var(--font-ui); font-size: 12px; color: var(--muted);
  /* fixed box: mixed-font glyphs (◌ + marks) must never change its height, or the centred deck shifts */
  flex: 0 0 20px; height: 20px; line-height: 20px;
  display: flex; gap: 10px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.status .cp { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.row { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: start; }
.row-label {
  font-family: var(--font-ui); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
  padding-top: 12px;
}
.row-label small { display: block; letter-spacing: 0; text-transform: none; opacity: .75; margin-top: 2px; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }

.k {
  --h: 44px;
  position: relative;
  min-width: 40px; height: var(--h); padding: 0 6px;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-text); font-size: 22px; line-height: 1; color: var(--ink);
  background: var(--key); border: 0; border-radius: 8px;
  box-shadow: 0 2px 0 var(--key-edge), 0 0 0 1px color-mix(in srgb, var(--key-edge) 45%, transparent);
  cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  transition: transform .06s ease, box-shadow .06s ease, background-color .15s;
}
.k:hover { background: color-mix(in srgb, var(--key) 85%, var(--accent)); }
.k.down, .k:active { transform: translateY(2px); box-shadow: 0 0 0 var(--key-edge), 0 0 0 1px color-mix(in srgb, var(--key-edge) 45%, transparent); }
.sup .k { min-width: 50px; --h: 56px; font-size: 42px; }
.sup .k .base { opacity: .55; }
.dia .k { min-width: 48px; font-size: 26px; }
.let .k { min-width: 46px; --h: 52px; font-size: 26px; }
.k .base { color: var(--muted); }
.k .num {
  position: absolute; top: 4px; left: 6px;
  font-family: var(--font-ui); font-size: 10px; font-weight: 600; line-height: 1; color: var(--muted);
}
.status .sc { margin-left: auto; color: var(--ink); font-weight: 600; }

.k.fn {
  font-family: var(--font-ui); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  padding: 0 14px;
}
.k.fn svg { width: 18px; height: 18px; }
.k.shift[data-state="once"] { background: var(--accent-soft); color: var(--accent); }
.k.shift[data-state="lock"] { background: var(--accent); color: var(--paper); }

/* ---------- overflow menu ---------- */
.menu-wrap { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, 2vw); z-index: 10; }
.menu-btn {
  position: relative; display: block; padding: 5px; line-height: 0;
  background: var(--dots-bg); color: #fff; border: 0; border-radius: 8px; cursor: pointer;
  transition: background-color .15s;
}
.menu-btn::before { content: ""; position: absolute; inset: -10px; } /* larger tap area, invisible */
.menu-btn:hover, .menu-btn[aria-expanded="true"] { background: var(--select); }
.menu-btn svg { width: 6px; height: 22px; display: block; }
.menu {
  position: absolute; right: 0; top: calc(100% + 10px); width: 260px;
  background: var(--key); color: var(--ink); border-radius: 12px; padding: 14px;
  box-shadow: 0 10px 30px color-mix(in srgb, var(--ink) 18%, transparent), 0 0 0 1px color-mix(in srgb, var(--key-edge) 50%, transparent);
  display: flex; flex-direction: column; gap: 14px;
  font-family: var(--font-ui); font-size: 13px;
}
.menu-row { display: flex; flex-direction: column; gap: 8px; }
.menu-row .lbl { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.menu-row .lbl output { color: var(--ink); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.size-ctl { display: flex; align-items: center; gap: 8px; }
.size-ctl input { flex: 1; accent-color: var(--accent); min-width: 0; }
.size-ctl button, .menu .action {
  font: inherit; color: var(--ink); background: var(--deck); border: 0; border-radius: 8px; cursor: pointer;
}
.size-ctl button { width: 32px; height: 32px; font-weight: 600; }
.menu .action { padding: 9px 12px; text-align: left; }
.menu .action.danger { color: var(--danger); }
.menu .action.danger[data-armed="true"] { background: var(--danger); color: var(--key); }
.menu hr { border: 0; border-top: 1px solid color-mix(in srgb, var(--muted) 25%, transparent); margin: 0; }
.menu-btn:focus-visible, .menu button:focus-visible, .menu input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.toast {
  position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px));
  transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--paper);
  font-family: var(--font-ui); font-size: 13px; padding: 8px 14px; border-radius: 999px;
  transition: opacity .18s, transform .18s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 640px) {
  .row { grid-template-columns: 1fr; gap: 6px; }
  .row-label { padding-top: 0; }
  .row-label small { display: inline; margin-left: 6px; }
  .sup .k { min-width: 42px; --h: 48px; font-size: 28px; padding: 0 4px; }
  .let .k { min-width: 44px; --h: 46px; }
  .keys { gap: 5px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<div class="menu-wrap">
  <button class="menu-btn" id="menu-btn" type="button" aria-label="Options" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
    <svg viewBox="0 0 6 22" fill="currentColor"><circle cx="3" cy="3" r="3"/><circle cx="3" cy="11" r="3"/><circle cx="3" cy="19" r="3"/></svg>
  </button>
  <div class="menu" id="menu" hidden>
    <div class="menu-row">
      <div class="lbl"><span>Font size</span><output id="size-out">Auto</output></div>
      <div class="size-ctl">
        <button type="button" id="size-down" aria-label="Smaller">A−</button>
        <input type="range" id="size" min="20" max="120" step="2" aria-label="Font size">
        <button type="button" id="size-up" aria-label="Larger">A+</button>
      </div>
      <button type="button" class="action" id="size-auto">Reset to automatic size</button>
    </div>
    <hr>
    <button type="button" class="action" id="copy-all">Copy all text</button>
    <button type="button" class="action danger" id="clear-all">Clear all</button>
  </div>
</div>

<main class="page">
  <textarea id="text" lang="ro-Cyrl" spellcheck="false" autocomplete="off" autocapitalize="off"
    aria-label="Transcription text"></textarea>
  <div class="meta">
    <span class="hint"><b>Double-click the text</b> to copy all of it</span>
    <span><span id="count">0 characters</span></span>
  </div>
</main>

<section class="deck" aria-label="Wallachian Cyrillic keys">
  <div class="status" id="status" aria-live="polite"></div>

  <div class="row sup">
    <div class="row-label">Superscripts<small>combining letters</small></div>
    <div class="keys" id="row-sup"></div>
  </div>

  <div class="row dia">
    <div class="row-label">Diacritics<small>marks</small></div>
    <div class="keys" id="row-dia"></div>
  </div>

  <div class="row let">
    <div class="row-label">Letters<small>shift for capitals</small></div>
    <div class="keys" id="row-let"></div>
  </div>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  // ---- character sets (from keyboard.ods) ----
  const SUP = [
    ["ⷠ","be"],["ⷡ","ve"],["ⷢ","ghe"],["ⷣ","de"],["ⷤ","zhe"],["ⷥ","ze"],["ⷦ","ka"],["ⷧ","el"],
    ["ⷨ","em"],["ⷩ","en"],["ⷪ","o"],["ⷫ","pe"],["ⷬ","er"],["ⷭ","es"],["ⷮ","te"],["ⷯ","ha"],
    ["ⷰ","tse"],["ⷱ","che"],["ⷲ","sha"],["ⷳ","shcha"],["ⷴ","fita"],["ⷶ","a"],["ⷷ","ie"],["ⷸ","djerv"],
    ["ⷹ","monograph uk"],["ⷺ","yat"],["ⷻ","yu"],["ⷼ","iotified a"],["ⷽ","little yus"],["ⷾ","big yus"],
    ["ⷿ","iotified big yus"],["ꙵ","i"],["ꙶ","yi"],["ꙷ","u"],["ꙸ","hard sign"],["ꙹ","yeru"],
    ["ꙺ","soft sign"],["ꙻ","omega"]
  ].map(([c,n]) => ({ c, name: "combining cyrillic letter " + n, comb: true }));

  // Alt + native Cyrillic letter -> its superscript (same order as SUP)
  const SUP_BASE = "бвгджзклмнопрстхцчшщѳаеђꙋѣюꙗѧѫѭиїуъыьѡ";
  const ALT_SUP = {};
  [...SUP_BASE].forEach((b, i) => { ALT_SUP[b] = SUP[i]; SUP[i].alt = b; });
  // physical key -> Russian ЙЦУКЕН letter, for systems where Alt changes e.key (macOS Option)
  const RU = { KeyQ:"й",KeyW:"ц",KeyE:"у",KeyR:"к",KeyT:"е",KeyY:"н",KeyU:"г",KeyI:"ш",KeyO:"щ",KeyP:"з",
    BracketLeft:"х",BracketRight:"ъ",KeyA:"ф",KeyS:"ы",KeyD:"в",KeyF:"а",KeyG:"п",KeyH:"р",KeyJ:"о",KeyK:"л",
    KeyL:"д",Semicolon:"ж",Quote:"э",KeyZ:"я",KeyX:"ч",KeyC:"с",KeyV:"м",KeyB:"и",KeyN:"т",KeyM:"ь",
    Comma:"б",Period:"ю",Backquote:"ё" };

  const DIA = [
    ["꙯","combining cyrillic vzmet",true],
    ["҇","combining cyrillic pokrytie",true],
    ["҃","combining cyrillic titlo",true],
    ["҄","combining cyrillic palatalization",true],
    ["ꙿ","cyrillic payerok",false],
    ["̀","combining grave accent",true],
    ["҆","combining cyrillic psili pneumata",true],
    ["†","dagger",false]
  ].map(([c,name,comb]) => ({ c, name, comb }));

  // [lower, upper, name]. ꙟ (U+A65F) was added as the lowercase of Ꙟ.
  const LET = [
    ["ꙋ","Ꙋ","monograph uk"],["ѡ","Ѡ","omega"],["ѹ","Ѹ","uk"],["ѿ","Ѿ","ot"],
    ["ѣ","Ѣ","yat"],["ѧ","Ѧ","little yus"],["ѩ","Ѩ","iotified little yus"],["ѫ","Ѫ","big yus"],
    ["ѭ","Ѭ","iotified big yus"],["ѱ","Ѱ","psi"],["ꙟ","Ꙟ","yn"],["і","І","byelorussian-ukrainian i"],
    ["ї","Ї","yi"],["ꙗ","Ꙗ","iotified a"],
    ["ҁ","Ҁ","koppa"],["ѵ","Ѵ","izhitsa"],["ѳ","Ѳ","fita"],["ѯ","Ѯ","ksi"],
    ["ђ","Ђ","dje"],["ћ","Ћ","tshe"]
  ];

  const $ = id => document.getElementById(id);
  const ta = $("text"), statusEl = $("status"), toastEl = $("toast"), countEl = $("count");
  const cp = ch => "U+" + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, "0");

  // ---- persistence (per-browser draft only) ----
  const KEY = "wlachtype:draft";
  try { const s = localStorage.getItem(KEY); if (s) ta.value = s; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, ta.value); } catch (e) {} };
  const updateCount = () => {
    const n = [...ta.value].length;
    countEl.textContent = n + (n === 1 ? " character" : " characters");
  };

  // ---- insertion ----
  function insert(str) {
    const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
    ta.setRangeText(str, s, e, "end");
    ta.dispatchEvent(new Event("input"));
  }
  function backspace() {
    const s = ta.selectionStart, e = ta.selectionEnd;
    if (s !== e) ta.setRangeText("", s, e, "end");
    else if (s > 0) ta.setRangeText("", s - 1, s, "end");
    ta.dispatchEvent(new Event("input"));
  }

  // ---- shift state: off | once | lock ----
  let shift = "off", physShift = false, lastShiftTap = 0;
  const letterKeys = [];
  function upper() { return shift !== "off" || physShift; }
  function renderShift() {
    shiftKey.dataset.state = shift;
    shiftKey.setAttribute("aria-pressed", shift !== "off");
    const up = upper();
    letterKeys.forEach(({ el, lo, hi }) => { el.textContent = up ? hi : lo; });
  }

  // ---- key factory ----
  function makeKey(label, title, onPress, cls) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "k" + (cls ? " " + cls : "");
    if (typeof label === "string") b.textContent = label; else b.append(label);
    b.addEventListener("pointerdown", e => { e.preventDefault(); b.classList.add("down"); });
    ["pointerup","pointerleave","pointercancel"].forEach(t => b.addEventListener(t, () => b.classList.remove("down")));
    b.addEventListener("click", () => { onPress(); });
    const show = () => { if (title) statusEl.innerHTML = title(); };
    const hide = () => { statusEl.textContent = ""; };
    b.addEventListener("pointerenter", show); b.addEventListener("focus", show);
    b.addEventListener("pointerleave", hide); b.addEventListener("blur", hide);
    return b;
  }
  const glyphLabel = (c, comb) => {
    const f = document.createDocumentFragment();
    if (comb) { const s = document.createElement("span"); s.className = "base"; s.textContent = "◌"; f.append(s); f.append(c); }
    else f.append(c);
    return f;
  };
  const describe = (c, name, shortcut) => () => `<span class="cp">${cp(c)}</span><span>${/[ꙿ†]/.test(c) ? c : "◌" + c}</span><span>${name.toUpperCase()}</span>${shortcut ? `<span class="sc">${shortcut}</span>` : ""}`;

  SUP.forEach(({ c, name, comb, alt }) => $("row-sup").append(makeKey(glyphLabel(c, comb), describe(c, name, "Alt + " + alt), () => insert(c))));
  DIA.forEach(({ c, name, comb }, i) => {
    const k = makeKey(glyphLabel(c, comb), describe(c, name, "Key " + (i + 1)), () => insert(c));
    const n = document.createElement("span"); n.className = "num"; n.textContent = i + 1; n.setAttribute("aria-hidden", "true");
    k.append(n); k.setAttribute("aria-label", name + ", key " + (i + 1));
    $("row-dia").append(k);
  });

  // ---- physical shortcuts: 1–8 type diacritics, Alt + letter types its superscript ----
  ta.addEventListener("keydown", e => {
    if (e.isComposing || e.ctrlKey || e.metaKey) return; // leaves Ctrl+C, AltGr (Ctrl+Alt) etc. alone
    const d = /^Digit([1-8])$/.exec(e.code);
    if (d && !e.shiftKey) {
      e.preventDefault();
      insert(e.altKey ? d[1] : DIA[d[1] - 1].c); // Alt + digit still types the digit itself
      return;
    }
    if (e.altKey) {
      const k = (e.key || "").toLowerCase();
      const hit = ALT_SUP[k] || ALT_SUP[RU[e.code]];
      if (hit) { e.preventDefault(); insert(hit.c); }
    }
  });
  // stop a lone Alt press from opening the browser menu while typing
  ta.addEventListener("keyup", e => { if (e.key === "Alt") e.preventDefault(); });

  const shiftIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 4 4 12h4.5v7h7v-7H20z"/></svg>';
  const shiftKey = makeKey("", () => "Shift: tap once for one capital, double-tap to lock", () => {
    const now = Date.now();
    if (shift === "off") shift = (now - lastShiftTap < 350) ? "lock" : "once";
    else if (shift === "once" && now - lastShiftTap < 350) shift = "lock";
    else shift = "off";
    lastShiftTap = now; renderShift();
  }, "fn shift");
  shiftKey.innerHTML = shiftIcon; shiftKey.setAttribute("aria-label", "Shift");
  $("row-let").append(shiftKey);

  LET.forEach(([lo, hi, name]) => {
    const el = makeKey(lo, () => {
      const c = upper() ? hi : lo;
      return describe(c, "cyrillic " + (upper() ? "capital" : "small") + " letter " + name)();
    }, () => {
      insert(upper() ? hi : lo);
      if (shift === "once") { shift = "off"; renderShift(); }
    });
    letterKeys.push({ el, lo, hi });
    $("row-let").append(el);
  });

  $("row-let").append(
    (() => { const b = makeKey("", () => "Delete the character before the cursor", backspace, "fn");
      b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7z"/><path d="m12 9 5 6m0-6-5 6"/></svg>';
      b.setAttribute("aria-label", "Backspace"); return b; })()
  );

  // physical Shift previews capitals on the deck
  addEventListener("keydown", e => { if (e.key === "Shift" && !physShift) { physShift = true; renderShift(); } });
  addEventListener("keyup", e => { if (e.key === "Shift") { physShift = false; renderShift(); } });
  addEventListener("blur", () => { physShift = false; renderShift(); });

  // ---- click to copy ----
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
  }
  function fallbackCopy(text, partial) {
    const s = ta.selectionStart, e = ta.selectionEnd;
    if (!partial) ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (err) {}
    if (!partial) ta.setSelectionRange(s, e);
    toast(ok ? "Copied" : "Copy blocked here. Press Ctrl+C");
  }
  function copyAll() {
    const text = ta.value;
    if (!text) { toast("Nothing to copy"); return; }
    const n = [...text].length, label = "Copied · " + n + (n === 1 ? " character" : " characters");
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(text).then(() => toast(label), () => fallbackCopy(text, false));
    } else fallbackCopy(text, false);
  }
  ta.addEventListener("dblclick", () => {
    // double-click natively selects a word; drop that highlight so it is clear the whole text was copied
    const caret = ta.selectionEnd; ta.setSelectionRange(caret, caret);
    copyAll();
  });

  // shrink the text as more is typed so it always fits the field
  const AUTO_FS = () => Math.round(Math.min(72, Math.max(36, innerWidth / 14)));
  const MIN_FS = 18, SIZE_KEY = "wlachtype:size";
  let userSize = null; // null = automatic
  try { const v = parseInt(localStorage.getItem(SIZE_KEY), 10); if (v) userSize = v; } catch (e) {}
  const MAX_FS = () => userSize ?? AUTO_FS();
  function fit() {
    let fs = MAX_FS();
    ta.style.fontSize = fs + "px";
    while (fs > MIN_FS && ta.scrollHeight > ta.clientHeight + 1) {
      fs -= 2; ta.style.fontSize = fs + "px";
    }
  }
  addEventListener("resize", fit);
  document.fonts?.ready.then(fit);

  // block copying, cutting or dragging anything outside the text field
  ["copy","cut","dragstart"].forEach(t => document.addEventListener(t, e => { if (e.target !== ta) e.preventDefault(); }));

  ta.addEventListener("input", () => { save(); updateCount(); fit(); });
  // ---- options menu ----
  const menu = $("menu"), menuBtn = $("menu-btn"), sizeIn = $("size"), sizeOut = $("size-out"), clearBtn = $("clear-all");
  function disarm() { clearBtn.dataset.armed = "false"; clearBtn.textContent = "Clear all"; }
  function openMenu(open) {
    menu.hidden = !open; menuBtn.setAttribute("aria-expanded", open);
    if (!open) disarm();
  }
  menuBtn.addEventListener("click", () => openMenu(menu.hidden));
  document.addEventListener("pointerdown", e => { if (!menu.hidden && !e.target.closest(".menu-wrap")) openMenu(false); });
  addEventListener("keydown", e => { if (e.key === "Escape" && !menu.hidden) { openMenu(false); menuBtn.focus(); } });

  function renderSize() {
    sizeIn.value = MAX_FS();
    sizeOut.textContent = userSize ? userSize + " px" : "Auto · " + AUTO_FS() + " px";
    $("size-auto").hidden = !userSize;
  }
  function setSize(v) {
    userSize = v == null ? null : Math.max(20, Math.min(120, v));
    try { userSize ? localStorage.setItem(SIZE_KEY, userSize) : localStorage.removeItem(SIZE_KEY); } catch (e) {}
    renderSize(); fit();
  }
  sizeIn.addEventListener("input", () => setSize(+sizeIn.value));
  $("size-down").addEventListener("click", () => setSize(MAX_FS() - 4));
  $("size-up").addEventListener("click", () => setSize(MAX_FS() + 4));
  $("size-auto").addEventListener("click", () => setSize(null));
  addEventListener("resize", renderSize);

  $("copy-all").addEventListener("click", () => { copyAll(); openMenu(false); });

  clearBtn.addEventListener("click", () => {
    if (!ta.value) { toast("Nothing to clear"); return; }
    if (clearBtn.dataset.armed !== "true") {
      clearBtn.dataset.armed = "true"; clearBtn.textContent = "Click again to delete all text"; return;
    }
    ta.value = ""; ta.dispatchEvent(new Event("input"));
    openMenu(false); toast("Text cleared"); ta.focus();
  });

  renderShift(); updateCount(); renderSize(); fit();
  ta.focus();
})();
</script>
</body>
</html>
